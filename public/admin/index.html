<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FLAMES Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f3ee;color:#17120f}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;font-size:23px}.brand b{color:#d95832}.muted{color:#8c8178;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel,.login{background:#fff;border:1px solid #e6ddd3;border-radius:18px;padding:20px}.card small{color:#91867d;font-weight:800}.num{font-size:34px;font-weight:900;margin-top:8px}.panel{margin-top:18px}.event{display:flex;justify-content:space-between;border-bottom:1px solid #eee7df;padding:12px 0;font-size:13px}.event:last-child{border:0}.btn{border:0;border-radius:10px;background:#17120f;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.login{max-width:390px;margin:18vh auto}.login h1{margin-top:0}.login input{width:100%;padding:13px;border:1px solid #ddd2c5;border-radius:10px;margin:10px 0 12px}.error{color:#c7442b;font-size:12px;margin-top:10px}.status{padding:10px 12px;background:#f4eee7;border-radius:10px;font-size:12px;margin-bottom:15px}@media(max-width:650px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}.wrap{padding:20px 14px}}table{width:100%;border-collapse:collapse}td{padding:10px 0;border-bottom:1px solid #eee7df;font-size:13px}td:last-child{text-align:right;font-weight:800}
